# Dependency updates into `master`: once a month, one grouped PR per ecosystem, no labels.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: []
    # Lockstep and pinned lines, bumped together by hand (ADR 0018, ADR 0021).
    ignore:
      # Kotlin, its compose compiler and the Kotlin compiler Konsist embeds.
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "gradle-wrapper"
      # Compose Multiplatform, JetBrains material3 and the JetBrains and Jetpack lines CMP pairs with
      # (the strict Jetpack material3 pin of ADR 0021 included).
      - dependency-name: "org.jetbrains.compose*"
      - dependency-name: "org.jetbrains.androidx.*"
      - dependency-name: "androidx.compose.*"
      - dependency-name: "androidx.navigation3:*"
      - dependency-name: "co.touchlab.skie*"
      - dependency-name: "com.lemonappdev:*"
      # Own libraries (Core 1.x, MyItmoApi), bumped with the matching app change.
      - dependency-name: "dev.alllexey:*"
      # Robolectric's SDK jars, pinned to the SDK levels the tests run on; they follow Robolectric by hand.
      - dependency-name: "org.robolectric:android-all-instrumented"
    groups:
      gradle:
        patterns: ["*"]

  # Keeps the SHA pins in .github/workflows and the composite actions, and their version comments.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: []
    groups:
      actions:
        patterns: ["*"]
