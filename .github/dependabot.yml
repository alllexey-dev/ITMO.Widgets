# Dependency updates into `master`, at most two open PRs per ecosystem.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Lockstep and pinned lines, bumped together by hand (ADR 0018, ADR 0021).
    ignore:
      # Kotlin, its compose compiler and the Kotlin compiler Konsist embeds.
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "gradle-wrapper"
      # Compose Multiplatform, JetBrains material3 and the JetBrains and Jetpack lines CMP pairs with
      # (the strict Jetpack material3 pin of ADR 0021 included).
      - dependency-name: "org.jetbrains.compose*"
      - dependency-name: "org.jetbrains.androidx.*"
      - dependency-name: "androidx.compose.*"
      - dependency-name: "androidx.navigation3:*"
      - dependency-name: "co.touchlab.skie*"
      - dependency-name: "com.lemonappdev:*"
      # Own libraries (Core 1.x, MyItmoApi), bumped with the matching app change.
      - dependency-name: "dev.alllexey:*"
    # A dependency matching several groups lands in the first, so androidx.test goes to test.
    groups:
      test:
        patterns:
          - "junit:*"
          - "androidx.test*"
          - "org.robolectric:*"
          - "io.github.takahirom.roborazzi*"
          - "io.github.sergio-sastre*"
          - "app.cash.turbine:*"
      androidx:
        patterns:
          - "androidx.*"
      firebase:
        patterns:
          - "com.google.firebase*"
      ktor:
        patterns:
          - "io.ktor*"
      koin:
        patterns:
          - "io.insert-koin*"

  # Keeps the SHA pins in .github/workflows and their version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
