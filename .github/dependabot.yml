# Dependency updates (L04 TC-08). Dependabot reads this file from the default branch only, so it starts after
# a promote puts it on master; every PR targets v2.3/next, where the integrator merges it only while no L04
# build-file PR is open. Two open PRs per ecosystem keep the integrator queue free.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: v2.3/next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Lockstep and pinned lines: only L04 cards bump them (ADR 0018, ADR 0021, spike verdicts).
    ignore:
      # Kotlin, its compose compiler and the Kotlin compiler Konsist embeds, with KSP.
      - dependency-name: "org.jetbrains.kotlin:*"
      - dependency-name: "com.google.devtools.ksp*"
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "gradle-wrapper"
      - dependency-name: "com.google.dagger:*"
      # Compose Multiplatform, JetBrains material3 and the JetBrains and Jetpack lines CMP pairs with
      # (the strict Jetpack material3 pin of ADR 0021 included).
      - dependency-name: "org.jetbrains.compose*"
      - dependency-name: "org.jetbrains.androidx.*"
      - dependency-name: "androidx.compose.*"
      - dependency-name: "androidx.navigation3:*"
      - dependency-name: "co.touchlab.skie*"
      - dependency-name: "com.lemonappdev:*"
      # Core 1.x, MyItmoApi 1.x and my-itmo-api-kmp.
      - dependency-name: "dev.alllexey:*"
    # A dependency matching several groups lands in the first, so androidx.test goes to test.
    groups:
      test:
        patterns:
          - "junit:*"
          - "androidx.test*"
          - "org.robolectric:*"
          - "io.github.takahirom.roborazzi*"
          - "io.github.sergio-sastre*"
          - "app.cash.turbine:*"
      androidx:
        patterns:
          - "androidx.*"
      firebase:
        patterns:
          - "com.google.firebase*"
      ktor:
        patterns:
          - "io.ktor*"
      koin:
        patterns:
          - "io.insert-koin*"

  # Keeps the SHA pins in .github/workflows and their version comments.
  - package-ecosystem: github-actions
    directory: /
    target-branch: v2.3/next
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
