# Scheduled and advisory jobs; never a required check. Kept apart from android-ci.yml so push and PR runs
# never carry skipped check runs. A PR that edits this file or the platform list runs every job here once.
name: android-nightly

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-nightly.yml
      - app/src/androidTest/platform-tests.txt

concurrency:
  group: android-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Advisory: the dependency-analysis report of every module. The plugin loads only with
  # -Pitmo.buildHealth=true, so a failure here never reaches android-ci.yml.
  build-health:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: buildHealth
        env:
          CI: "true"
        run: ./gradlew -Pitmo.buildHealth=true buildHealth

      - name: Report summary
        if: always()
        run: |
          report=build/reports/dependency-analysis/build-health-report.txt
          [ -f "$report" ] || exit 0
          {
            echo '## buildHealth'
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-health-report
          path: build/reports/dependency-analysis/
          if-no-files-found: ignore
          retention-days: 14

  # The platform instrumentation list under Android Test Orchestrator on a Gradle Managed Device
  # (ciDevice, AOSP API 36; ATD has no quick settings tiles), which only CI creates.
  platform-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: verify.sh ui @platform --managed-device
        env:
          CI: "true"
        run: scripts/verify.sh ui @platform --managed-device

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-tests-reports
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: ignore
          retention-days: 14
