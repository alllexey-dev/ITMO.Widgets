# Scheduled and advisory jobs on `master`. To try a change to this file or the platform list before merging, run it
# on the branch: gh workflow run android-nightly.yml --ref <branch>. A failed platform run opens or updates an issue.
name: android-nightly

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

concurrency:
  group: android-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Advisory: the dependency-analysis report of every module. The plugin loads only with
  # -Pitmo.buildHealth=true, so a failure here never reaches android-ci.yml.
  build-health:
    # Scheduled runs only upstream: a fork that enables its schedules builds nothing.
    if: github.event_name != 'schedule' || github.repository == 'alllexey-dev/ITMO.Widgets'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: buildHealth
        env:
          CI: "true"
        run: ./gradlew -Pitmo.buildHealth=true buildHealth

      - name: Report summary
        if: always()
        run: |
          report=build/reports/dependency-analysis/build-health-report.txt
          [ -f "$report" ] || exit 0
          {
            echo '## buildHealth'
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-health-report
          path: build/reports/dependency-analysis/
          if-no-files-found: ignore
          retention-days: 14

  # The platform instrumentation list under Android Test Orchestrator on a Gradle Managed Device
  # (ciDevice, AOSP API 36; ATD has no quick settings tiles), which only CI creates.
  platform-tests:
    if: github.event_name != 'schedule' || github.repository == 'alllexey-dev/ITMO.Widgets'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: verify.sh ui @platform --managed-device
        env:
          CI: "true"
        run: scripts/verify.sh ui @platform --managed-device

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-tests-reports
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: ignore
          retention-days: 14

  # NavigationBenchmark (docs/testing.md "Baseline profiles"): frame timing of tab taps and of a push and pop on the
  # android-ui emulator, without the app's profile and with it; the profile run fails when the APK ships none. An
  # emulator on a shared runner is no phone: read the numbers as a trend between nights, not as absolute values.
  benchmarks:
    if: github.event_name != 'schedule' || github.repository == 'alllexey-dev/ITMO.Widgets'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Boots in the background while Gradle builds the benchmark APKs.
      - name: Start the emulator
        run: scripts/ci-emulator.sh start

      - uses: ./.github/actions/android-setup
        with:
          tasks: ":app:assembleGithubBenchmarkRelease :baselineprofile:assembleGithubBenchmarkRelease"

      - name: Build the app and benchmark APKs
        run: ./gradlew :app:assembleGithubBenchmarkRelease :baselineprofile:assembleGithubBenchmarkRelease

      - name: Wait for the emulator
        run: |
          set -o pipefail
          scripts/ci-emulator.sh wait | tee -a "$GITHUB_ENV"

      - name: NavigationBenchmark
        run: >-
          ./gradlew :baselineprofile:connectedGithubBenchmarkReleaseAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

      - name: Report summary
        if: always()
        run: |
          shopt -s globstar nullglob
          files=(baselineprofile/build/outputs/connected_android_test_additional_output/**/*benchmarkData.json)
          [ ${#files[@]} -gt 0 ] || exit 0
          {
            echo '## NavigationBenchmark (ms)'
            echo '| Benchmark | CPU P50 | CPU P90 | CPU P99 | Overrun P50 | Overrun P90 | Overrun P99 |'
            echo '|---|---|---|---|---|---|---|'
            jq -r 'def r: if . == null then "-" else . * 10 | round / 10 end;
              .benchmarks[] | (.sampledMetrics.frameDurationCpuMs // {}) as $c | (.sampledMetrics.frameOverrunMs // {}) as $o
              | "| \(.name) | \($c.P50|r) | \($c.P90|r) | \($c.P99|r) | \($o.P50|r) | \($o.P90|r) | \($o.P99|r) |"' "${files[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: navigation-benchmark
          path: |
            baselineprofile/build/outputs/connected_android_test_additional_output/
            baselineprofile/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 30

  # A failed nightly opens or updates an issue; the next passing one closes it.
  nightly-issue:
    needs: [platform-tests, benchmarks]
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.repository == 'alllexey-dev/ITMO.Widgets' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - uses: ./.github/actions/nightly-issue
        with:
          failed: ${{ contains(needs.*.result, 'failure') }}
