# Scheduled iOS jobs on `master`. Same toolchain steps as ios.yml (pins asserted, no fallback); no secrets, no
# signing. A failed nightly opens or updates an issue.
name: ios-nightly

on:
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch:

concurrency:
  group: ios-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  ios-nightly:
    # Scheduled runs only upstream: a fork that enables its schedules builds nothing.
    if: github.event_name != 'schedule' || github.repository == 'alllexey-dev/ITMO.Widgets'
    runs-on: xcode-27
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # kn: iosSimulatorArm64Test of every shared module with Kotlin tests; ui: the XCUITest target.
        suite: [kn, ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the pinned Xcode
        run: |
          version=$(sed -n 's/^: "\${ITMO_XCODE_VERSION:=\(.*\)}"$/\1/p' scripts/ios/env.sh)
          app="/Applications/Xcode_$version.app"
          if [ -z "$version" ] || [ ! -d "$app" ]; then
            echo "::error::Xcode ${version:-?} pinned in scripts/ios/env.sh is not on this runner image; move the pin in scripts/ios/env.sh."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "ITMO_DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          pinned=$(sed -n 's/^: "\${ITMO_XCODEGEN_VERSION:=\(.*\)}"$/\1/p' scripts/ios/env.sh)
          if [ "$pinned" != "$XCODEGEN_VERSION" ]; then
            echo "::error::scripts/ios/env.sh pins XcodeGen $pinned, ios-nightly.yml installs $XCODEGEN_VERSION; update both."
            exit 1
          fi
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen"
          bin=$(dirname "$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -n 1)")
          echo "$bin" >> "$GITHUB_PATH"

      - name: Toolchain pins
        run: |
          source scripts/ios/env.sh
          xcodebuild -version
          xcodegen --version

      # JetBrains 21, the daemon JDK of gradle/gradle-daemon-jvm.properties, as in ios.yml.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jetbrains
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Gradle toolchain without auto-download
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          {
            echo "org.gradle.java.installations.auto-download=false"
            echo "org.gradle.java.installations.paths=$JAVA_HOME"
          } >> "$GRADLE_USER_HOME/gradle.properties"
          "$JAVA_HOME/bin/java" -version

      - name: Kotlin/Native version
        id: kotlin-native
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Restore ~/.konan
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin-native.outputs.version }}

      # As in ios.yml: wrapper distribution and plugins resolved with retries before the long build.
      - name: Resolve Gradle plugins
        run: |
          for attempt in 1 2 3; do
            ./gradlew --quiet help && exit 0
            echo "::warning::Gradle plugin resolution failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          exit 1

      # kn without modules: every module with an iOS target, the umbrella `ios` included; Android-only modules have no
      # iosSimulatorArm64Test.
      - name: test.sh --ci ${{ matrix.suite }}
        env:
          CI: "true"
          SUITE: ${{ matrix.suite }}
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/iosApp/build/snapshot-artifacts
        run: |
          echo "org.gradle.workers.max=1" >> "$GRADLE_USER_HOME/gradle.properties"
          if [ "$SUITE" = kn ]; then
            scripts/ios/test.sh --ci kn
          else
            scripts/ios/test.sh --ci ui
          fi

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-nightly-${{ matrix.suite }}
          path: |
            iosApp/build/test-results/
            iosApp/build/snapshot-artifacts/
            shared/*/build/reports/
            shared/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # A failed nightly opens or updates an issue; the next passing one closes it.
  nightly-issue:
    needs: [ios-nightly]
    if: ${{ !cancelled() && github.event_name == 'schedule' && github.repository == 'alllexey-dev/ITMO.Widgets' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - uses: ./.github/actions/nightly-issue
        with:
          failed: ${{ contains(needs.*.result, 'failure') }}
