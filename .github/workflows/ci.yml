# Every PR into `master`, every push to `master` and manual runs. scripts/ci-plan.sh decides from the changed paths
# what runs (docs/testing.md#ci):
# - PR: the githubDebug unit tests, Konsist, the androidTest compile and the APK, the shared host tests, the
#   screenshot tests of the changed modules, the docs check and the iOS klibs; when an iOS input changed, the iOS app
#   is built (`test.sh --ci build`, no tests). A docs-only PR runs only the docs check.
# - push to `master`: verifyFull (both flavours, both lints), every screenshot module, and the iOS build with all its
#   tests (`test.sh --ci`) when an iOS input or any shared/ module changed; `master` also writes the caches PRs read.
#   The diff base is the last successful `master` run, so a cancelled or failed run loses nothing.
# - manual run (`gh workflow run ci.yml --ref <branch>`): everything, as if every path changed. Use it for a risky PR.
# The emulator, release and Kotlin/Native suites are in nightly.yml; nothing here is a required check.
name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Per ref: a newer push cancels the older run (on `master` too, the next run's diff base covers its changes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  plan:
    # A fork's pushes (its sync with upstream) run nothing there; its manual runs and PRs still do.
    if: github.event_name != 'push' || github.repository == 'alllexey-dev/ITMO.Widgets'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the last successful `master` run
    outputs:
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      gradle: ${{ steps.plan.outputs.gradle }}
      shots: ${{ steps.plan.outputs.shots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # PR: the merge commit against its first parent (the base head). Push: the head of the last successful
      # `master` run, else the push's `before`; without a base everything runs.
      - name: scripts/ci-plan.sh
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          base="" flags=--all
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) flags="" ;;
            push)
              flags=--full
              base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&event=push&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // empty' 2> /dev/null) || base=""
              [ -n "$base" ] || base=$BEFORE
              [ "$base" != 0000000000000000000000000000000000000000 ] || base=""
              if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2> /dev/null &&
                ! git fetch --quiet --depth=1 origin "$base"; then
                base=""
              fi
              [ -n "$base" ] || flags=--all
              ;;
          esac
          echo "diff base: ${base:-none} ($EVENT ${flags:-pr})"
          if [ -n "$base" ] && [ "$flags" != --all ]; then
            git diff --name-only "$base" HEAD | scripts/ci-plan.sh $flags | tee -a "$GITHUB_OUTPUT"
          else
            scripts/ci-plan.sh --all < /dev/null | tee -a "$GITHUB_OUTPUT"
          fi

  # The app's unit tests and its APK share one runner (they compile the same classes). The matrix name is also the
  # job's build cache line.
  gradle:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.gradle) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/android-setup
        with:
          build-cache: ${{ matrix.name }}
          tasks: ${{ matrix.tasks }}
          gradle-home-writer: ${{ matrix.home }}

      # No secrets: google-services.json is tracked, release stays unsigned, MyItmoApi comes from Maven Central.
      - name: ./gradlew ${{ matrix.tasks }}
        run: ./gradlew ${{ matrix.tasks }}

      - uses: ./.github/actions/build-cache-save
        with:
          build-cache: ${{ matrix.name }}

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.name }}
          path: |
            */build/reports/
            */build/test-results/
            shared/*/build/reports/
            shared/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Roborazzi on the JVM (ADR 0022): baselines compared, never recorded here. The plan gives either one job with the
  # changed modules or three shards of `verify.sh shots all` (every third module of its list each).
  shots:
    needs: plan
    if: needs.plan.outputs.shots != '[]' && needs.plan.outputs.shots != ''
    name: shots ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shots) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/android-setup
        with:
          build-cache: ${{ matrix.cache }}
          tasks: screenshotsVerify

      - name: verify.sh shots ${{ matrix.args }}
        id: shots
        env:
          ARGS: ${{ matrix.args }}
        run: |
          # shellcheck disable=SC2086 # one word per argument
          set -- $ARGS
          [ "$1" != all ] || exec scripts/verify.sh shots "$@"
          rc=0
          for module; do scripts/verify.sh shots "$module" || rc=1; done
          exit "$rc"

      - uses: ./.github/actions/build-cache-save
        with:
          build-cache: ${{ matrix.cache }}

      # Only a failed comparison uploads: <name>_compare.png (reference, diff, new), <name>_actual.png, the report.
      - name: Upload screenshot diffs
        if: failure() && steps.shots.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs-${{ strategy.job-index }}
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
            app/build/test-results/roborazzi/
            shared/*/build/outputs/roborazzi/
            shared/*/build/reports/roborazzi/
            shared/*/build/test-results/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

  # The Gradle-free checks (docs links, the ui-report and ci-plan self-tests) on every run, then the iOS klibs when an
  # Android input changed (a commonMain change that breaks the iOS compile fails here, without a Mac).
  checks:
    needs: plan
    name: checks and iOS klibs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: verify.sh checks
        run: scripts/verify.sh checks

      - uses: ./.github/actions/android-setup
        if: needs.plan.outputs.android == 'true'
        with:
          tasks: verifyIosKlibs

      # Kotlin/Native (about 1 GB in ~/.konan) per Kotlin version; only `master` writes the cache.
      - name: Kotlin/Native version
        id: kotlin-native
        if: needs.plan.outputs.android == 'true'
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Restore ~/.konan
        id: konan-cache
        if: needs.plan.outputs.android == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin-native.outputs.version }}

      # iOS klibs compile on Linux x86_64 without Xcode; never link* or *Test on Apple targets here.
      - name: ./gradlew verifyIosKlibs
        if: needs.plan.outputs.android == 'true'
        run: ./gradlew verifyIosKlibs

      - name: Save ~/.konan
        if: >-
          needs.plan.outputs.android == 'true' && github.ref == 'refs/heads/master' &&
          steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}

  # scripts/ios/test.sh on the macOS image with the Xcode pinned in scripts/ios/env.sh (arm64, 3 vCPU, 7 GB). A PR
  # only builds the app and its test bundles (the snapshot tests alone take about 17 minutes); `master` and manual
  # runs also run the unit and snapshot tests. No secrets, no signing.
  ios:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    name: ios ${{ github.event_name == 'pull_request' && 'build' || 'tests' }}
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/ios-setup
        id: setup
        with:
          cache-write: ${{ github.ref == 'refs/heads/master' }}

      - name: test.sh --ci ${{ github.event_name == 'pull_request' && 'build' || '' }}
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'build' || '' }}
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/iosApp/build/snapshot-artifacts
        run: |
          # shellcheck disable=SC2086 # empty for the full run
          scripts/ios/test.sh --ci $MODE

      - name: Save ~/.konan
        if: github.ref == 'refs/heads/master' && steps.setup.outputs.konan-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.setup.outputs.konan-key }}

      - name: Upload the result bundle and snapshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-results
          path: |
            iosApp/build/test-results/
            iosApp/build/snapshot-artifacts/
          if-no-files-found: ignore
          retention-days: 14
