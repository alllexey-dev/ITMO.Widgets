# Every PR into and every push to `v2.3/next` and `master`: scripts/verify.sh quick and the Android part of full,
# split into parallel jobs (L04 TC-CI1), and the iOS klibs. `verify-quick` is the aggregate job and the required
# check of the ruleset, `integrate merge` and `promote`; never rename it. It passes only when every part passed.
# Only always-running jobs live here: scheduled and advisory jobs go to android-nightly.yml,
# because a skipped job still leaves a `skipped` check run on the SHA.
name: android-ci

on:
  pull_request:
    branches: [v2.3/next, master]
  push:
    branches: [v2.3/next, master]
  workflow_dispatch:

# Per ref; only PR runs are cancelled, so every pushed `v2.3/next` SHA keeps its own result for `promote`.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"

jobs:
  # The parts of the root verifyQuick (build.gradle.kts) on runners of their own, plus lintPlayDebug, which makes
  # the union the Android part of verify.sh full. The app's unit tests and its APKs share one runner (they compile
  # the same classes). The matrix name is also the job's build cache line. Fewer, longer jobs keep a PR under the
  # 20 concurrent jobs of the free plan together with android-ui.
  gradle:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: app, tasks: verifyQuickUnitApp verifyQuickAssemble }
          - { name: unit-shared, tasks: verifyQuickUnitShared }
          - { name: lint-github, tasks: verifyQuickLint }
          - { name: lint-play, tasks: ":app:lintPlayDebug" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/android-setup
        with:
          build-cache: ${{ matrix.name }}
          tasks: ${{ matrix.tasks }}

      # No secrets: google-services.json is tracked, release stays unsigned, Core and MyItmoApi 1.x
      # come from Maven Central.
      - name: verify.sh run -- ${{ matrix.tasks }}
        run: scripts/verify.sh run -- ${{ matrix.tasks }}

      - uses: ./.github/actions/build-cache-save
        with:
          build-cache: ${{ matrix.name }}

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.name }}
          path: |
            */build/reports/
            */build/test-results/
            shared/*/build/reports/
            shared/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Roborazzi on the JVM (ADR 0022): every module's baselines, compared, never recorded here, in three shards of
  # `verify.sh shots all` (every third module of its list each).
  shots:
    name: shots ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/android-setup
        with:
          build-cache: shots-${{ matrix.shard }}
          tasks: screenshotsVerify

      - name: verify.sh shots all --shard ${{ matrix.shard }}/3
        id: shots
        run: scripts/verify.sh shots all --shard ${{ matrix.shard }}/3

      - uses: ./.github/actions/build-cache-save
        with:
          build-cache: shots-${{ matrix.shard }}

      # Only a failed comparison uploads: <name>_compare.png (reference, diff, new), <name>_actual.png, the report.
      - name: Upload screenshot diffs
        if: failure() && steps.shots.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-diffs-${{ matrix.shard }}
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
            app/build/test-results/roborazzi/
            shared/*/build/outputs/roborazzi/
            shared/*/build/reports/roborazzi/
            shared/*/build/test-results/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

  # The Gradle-free part of verify.sh quick (docs and changelog drift, the module generator, the ui-report and
  # ship-check tests), then the iOS klibs.
  checks-klibs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: verify.sh checks
        run: scripts/verify.sh checks

      - uses: ./.github/actions/android-setup
        with:
          tasks: verifyIosKlibs

      # Kotlin/Native (about 1 GB in ~/.konan) per Kotlin version; only `v2.3/next` writes the cache.
      - name: Kotlin/Native version
        id: kotlin-native
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Restore ~/.konan
        id: konan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin-native.outputs.version }}

      # iOS klibs compile on Linux x86_64 without Xcode (SP-10); never link* or *Test on Apple targets here.
      - name: verify.sh klibs
        run: scripts/verify.sh klibs

      - name: Save ~/.konan
        if: github.ref == 'refs/heads/v2.3/next' && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}

  # The required check: green only when every part above is green; a failed, skipped or cancelled part fails it.
  verify-quick:
    needs: [checks-klibs, gradle, shots]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "- \(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s' "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
