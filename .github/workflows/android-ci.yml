# Every PR into and every push to `v2.3/next` and `master`: scripts/verify.sh quick, then the iOS klibs.
# `verify-quick` is the required check of the ruleset, `integrate merge` and `promote`; never rename it.
# Only always-running jobs live here: scheduled and advisory jobs go to android-nightly.yml,
# because a skipped job still leaves a `skipped` check run on the SHA.
name: android-ci

on:
  pull_request:
    branches: [v2.3/next, master]
  push:
    branches: [v2.3/next, master]
  workflow_dispatch:

# Per ref; only PR runs are cancelled, so every pushed `v2.3/next` SHA keeps its own result for `promote`.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JDK for the Gradle client; the daemon JDK (JetBrains 21) is provisioned from
      # gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Basic (MIT) cache provider; only `v2.3/next` writes the cache, everything else reads it.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/v2.3/next' }}

      # No secrets: google-services.json is tracked, release stays unsigned, Core and MyItmoApi
      # come from Maven Central. scripts/check-docs.sh runs first inside verify.sh once it exists.
      - name: verify.sh quick
        env:
          CI: "true"
        run: scripts/verify.sh quick

      # Kotlin/Native (about 1 GB in ~/.konan) per Kotlin version; only `v2.3/next` writes the cache.
      - name: Kotlin/Native version
        id: kotlin-native
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Restore ~/.konan
        id: konan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin-native.outputs.version }}

      # iOS klibs compile on Linux x86_64 without Xcode (SP-10); never link* or *Test on Apple targets here.
      - name: verify.sh klibs
        env:
          CI: "true"
        run: scripts/verify.sh klibs

      - name: Save ~/.konan
        if: github.ref == 'refs/heads/v2.3/next' && steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-quick-reports
          path: |
            */build/reports/
            */build/test-results/
            shared/*/build/reports/
            shared/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
