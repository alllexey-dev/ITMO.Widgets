# The ship check stages that need no release key (L04 TC-CI1), on every push to `v2.3/next` and on demand:
# scripts/ship-check.sh stages 1 version and 3 release (unsigned release builds, check-play-policy.sh), 5 upgrade
# (v2.2 githubDebug, the 2.2 data, `adb install -r` of the head) and 6 shrunk (both minifiedSmoke builds started
# on the device), each group on a runner of its own; the device stages run on that job's emulator. Stage 2 is
# android-ci's `verify-quick` (its parts are verify.sh full), stage 4 is android-ui's `android-ui`.
# `android-ship` is the aggregate job; it merges the parts into one summary.md in the ship check's format and
# uploads it as the artifact `ship-<sha7>`. A PR that edits this workflow or the scripts it runs runs it once.
name: android-ship

on:
  push:
    branches: [v2.3/next]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to check (default the branch the run starts from)
        required: false
        default: ""
  pull_request:
    branches: [v2.3/next]
    paths:
      - .github/workflows/android-ship.yml
      - .github/actions/**
      - scripts/ship-check.sh
      - scripts/ci-emulator.sh

concurrency:
  group: android-ship-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"

jobs:
  stage:
    name: ship ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: version-release
            only: "1,3"
            device: false
            prebuild: ""
            tasks: ":app:assembleGithubRelease :app:bundlePlayRelease"
          - name: upgrade
            only: "5"
            device: true
            prebuild: ":app:assembleGithubDebug"
            tasks: ":app:assembleGithubDebug"
          - name: shrunk
            only: "6"
            device: true
            prebuild: ":app:assembleGithubMinifiedSmoke :app:assemblePlayMinifiedSmoke"
            tasks: ":app:assembleGithubMinifiedSmoke :app:assemblePlayMinifiedSmoke"
    steps:
      # ship-check.sh keeps its summary, logs, the v2.2 worktree and the cached v2.2 APK under $ITMO_WT.
      - name: Ship check directory
        run: |
          echo "ITMO_WT=$RUNNER_TEMP/ship-wt" >> "$GITHUB_ENV"
          echo "DEBUG_KEY_DIRS=$HOME/.config/.android $HOME/.android" >> "$GITHUB_ENV"

      # Full history: stage 1 reads the beta tags and origin/release/2.2, stage 5 builds the v2.2 tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Start the emulator
        if: matrix.device
        run: scripts/ci-emulator.sh start

      - uses: ./.github/actions/android-setup
        with:
          build-cache: ship-${{ matrix.name }}
          tasks: ${{ matrix.tasks }}

      # The v2.2 APK and the debug key that signed it, cached together under a key that ends in the key's certificate
      # digest. The key goes where AGP reads it before the head is built, so the head carries it and stage 5 finds the
      # APK named by that certificate. Without an entry, or if the head ends up with another key, stage 5 builds v2.2
      # in this job with the head's key: the cache only saves that build, the check never depends on it.
      - name: v2.2 commit
        id: v22
        if: matrix.name == 'upgrade'
        run: echo "sha=$(git rev-parse 'v2.2^{commit}')" >> "$GITHUB_OUTPUT"

      - name: Restore the v2.2 APK
        id: v22-cache
        if: matrix.name == 'upgrade'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ITMO_WT }}/run/apk
          key: ship-v22-apk-v2-${{ steps.v22.outputs.sha }}
          restore-keys: ship-v22-apk-v2-${{ steps.v22.outputs.sha }}-

      - name: Debug key of the v2.2 APK
        if: matrix.name == 'upgrade'
        run: |
          key="$ITMO_WT/run/apk/debug.keystore"
          if [ -f "$key" ]; then
            # AGP 8 and 9 keep the debug key in ~/.config/.android on these runners (~/.android on macOS).
            for dir in $DEBUG_KEY_DIRS; do
              mkdir -p "$dir"
              cp "$key" "$dir/debug.keystore"
            done
            echo "debug key from the cache, certificate SHA-256:"
            keytool -list -v -keystore "$key" -storepass android | grep 'SHA256:'
          else
            echo "no cached debug key: the head build creates one and stage 5 builds v2.2 with it"
          fi

      # Builds what the stage installs while the emulator boots; the stage's own build is then up to date.
      - name: Build ahead of the device
        if: matrix.prebuild != ''
        run: scripts/verify.sh run -- ${{ matrix.prebuild }}

      - name: Wait for the emulator
        if: matrix.device
        run: |
          set -o pipefail
          scripts/ci-emulator.sh wait --cutout none | tee -a "$GITHUB_ENV"

      # --local: every selected stage runs here (ship-check.sh would otherwise read stages 5 and 6 from this check).
      - name: ship-check.sh --only ${{ matrix.only }}
        run: |
          flags="--local --keep-going --only ${{ matrix.only }}"
          [ "${{ matrix.device }}" = true ] || flags="--no-device $flags"
          scripts/ship-check.sh $flags

      # Saves the v2.2 APK signed with this runner's debug key, with that key, unless the restored entry was exactly it.
      - name: v2.2 APK cache key
        id: v22-key
        if: matrix.name == 'upgrade' && github.ref == 'refs/heads/v2.3/next'
        env:
          V22_SHA: ${{ steps.v22.outputs.sha }}
        run: |
          apk=""
          for dir in $DEBUG_KEY_DIRS; do
            key="$dir/debug.keystore"
            cert=$(keytool -list -v -keystore "$key" -storepass android 2> /dev/null |
              sed -n 's/^.*SHA256: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
            [ -n "$cert" ] || continue
            apk=$(find "$ITMO_WT/run/apk" -name "v2.2-*-githubDebug-${cert:0:16}.apk" | head -n 1)
            [ -z "$apk" ] || break
          done
          if [ -z "$apk" ]; then
            echo "::warning::no v2.2 APK signed with a debug key in $DEBUG_KEY_DIRS: nothing to cache"
            exit 0
          fi
          find "$ITMO_WT/run/apk" -type f ! -path "$apk" -delete
          cp "$key" "$ITMO_WT/run/apk/debug.keystore"
          echo "key=ship-v22-apk-v2-$V22_SHA-${cert:0:16}" >> "$GITHUB_OUTPUT"

      - name: Save the v2.2 APK
        if: >-
          steps.v22-key.outputs.key != '' &&
          steps.v22-key.outputs.key != steps.v22-cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ITMO_WT }}/run/apk
          key: ${{ steps.v22-key.outputs.key }}

      - uses: ./.github/actions/build-cache-save
        with:
          build-cache: ship-${{ matrix.name }}

      - name: Upload the stage summary and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per attempt, as android-ui.yml: the download keeps the highest artifact id, not the newest rerun.
          name: ship-part-${{ matrix.name }}-a${{ github.run_attempt }}
          path: ${{ env.ITMO_WT }}/run/ship/
          if-no-files-found: warn
          retention-days: 14

  # One summary.md in ship-check.sh's format for the head: the rows of every part, sorted by stage; any FAIL, a
  # missing part or a failed part job fails the check. Uploaded as `ship-<sha7>` with every stage log.
  android-ship:
    needs: stage
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ship-part-*
          path: parts

      - name: Merge the summaries
        id: merge
        env:
          STAGES: ${{ needs.stage.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPECTED: version-release upgrade shrunk
        run: |
          ok=0
          shas=$(find parts -mindepth 2 -maxdepth 2 -type d -printf '%f\n' | sort -u)
          if [ "$(printf '%s\n' "$shas" | grep -c .)" -ne 1 ]; then
            echo "::error::the parts name $(printf '%s ' $shas)instead of one head"
            ok=1
          fi
          sha=$(printf '%s\n' "$shas" | head -n 1)
          out="ship-$sha"
          mkdir -p "$out"
          rows=""
          for part in $EXPECTED; do
            dir="$(ls -d "parts/ship-part-$part-a"* 2> /dev/null | sort -V | tail -n 1)/$sha"
            if [ ! -f "$dir/summary.md" ]; then
              echo "::error::part $part left no summary (missing run)"
              rows="$rows| $part | MISSING | - | - | - |"$'\n'
              ok=1
              continue
            fi
            cp "$dir"/*.log "$out/" 2> /dev/null || true
            rows="$rows$(grep -E '^\| [0-9] ' "$dir/summary.md" | sed "s#| local |#| CI run $RUN_URL |#")"$'\n'
            head=$(sed -n 's/^- Head: `\(.*\)`$/\1/p' "$dir/summary.md")
            # The earliest part's start (the format sorts as text).
            part_started=$(sed -n 's/^- Started: //p' "$dir/summary.md")
            if [ -z "${started:-}" ] || [[ $part_started < $started ]]; then started=$part_started; fi
          done
          {
            printf '# Ship check %s\n\n' "$sha"
            printf -- '- Head: `%s`\n' "${head:-unknown}"
            printf -- '- Worktree: `%s`\n' "$RUN_URL"
            printf -- '- Mode: android-ship\n'
            printf -- '- Source: stages 1, 3, 5, 6 in this CI run; stage 2 is the verify-quick check, 4 android-ui\n'
            printf -- '- Started: %s\n\n' "${started:-unknown}"
            printf '| Stage | Result | Time | Source | Log |\n|---|---|---|---|---|\n'
            printf '%s' "$rows" | grep . | sort
          } > "$out/summary.md"
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^\| [0-9a-z -]+ \| (FAIL|NOT RUN|MISSING) ' "$out/summary.md" && ok=1
          [ "$STAGES" = success ] || { echo "::error::the stage jobs ended $STAGES"; ok=1; }
          echo "dir=$out" >> "$GITHUB_OUTPUT"
          exit "$ok"

      - name: Upload ship-<sha7>
        if: always() && steps.merge.outputs.dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.merge.outputs.dir }}
          path: ${{ steps.merge.outputs.dir }}/
          retention-days: 30
