# The instrumented tests on emulators: `verify.sh ui all` in 6 shards on a Pixel-geometry emulator without a cutout,
# and `verify.sh ui ShellSuite` (the shell, its insets and the tab swipe) in 2 shards on the same emulator with the
# tall cutout overlay, so the shell is also tested on a cutout. Nightly on `master`, on demand, and on PRs labelled
# `full-ci`; never on other PRs, so merging never waits for an emulator. A failed nightly opens or updates an issue.
# `android-ui` is the aggregate job: it fails when a shard failed, is missing or ran no test, and
# scripts/ui-report.py fails a shard on any failed run of any test, not only on the last run Gradle keeps.
name: android-ui

on:
  schedule:
    - cron: "13 2 * * *"
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to test (default the branch the run starts from)
        required: false
        default: ""

# Per ref; a newer push to a labelled PR cancels its older run. A label event that starts no run gets a group of its
# own, so it cancels nothing.
concurrency:
  group: >-
    android-ui-${{ github.ref }}-${{ inputs.ref }}-${{ github.event_name == 'pull_request'
    && !contains(github.event.pull_request.labels.*.name, 'full-ci') && github.run_id || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"

jobs:
  ui:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: ui ${{ matrix.config }} ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: plain, cutout: none, tests: all, shards: 6, shard: 0 }
          - { config: plain, cutout: none, tests: all, shards: 6, shard: 1 }
          - { config: plain, cutout: none, tests: all, shards: 6, shard: 2 }
          - { config: plain, cutout: none, tests: all, shards: 6, shard: 3 }
          - { config: plain, cutout: none, tests: all, shards: 6, shard: 4 }
          - { config: plain, cutout: none, tests: all, shards: 6, shard: 5 }
          - { config: cutout, cutout: tall, tests: ShellSuite, shards: 2, shard: 0 }
          - { config: cutout, cutout: tall, tests: ShellSuite, shards: 2, shard: 1 }
    env:
      SHARD_ID: ${{ matrix.config }}-${{ matrix.shard }}
      OUT: ${{ github.workspace }}/ui-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Boots in the background while Gradle builds both APKs.
      - name: Start the emulator
        run: |
          df -h / | tail -n 1
          scripts/ci-emulator.sh start

      # Every shard builds the same APKs; one line of build cache serves them all, saved by plain shard 0.
      - uses: ./.github/actions/android-setup
        with:
          build-cache: ui
          tasks: ":app:assembleGithubDebug :app:assembleGithubDebugAndroidTest"

      - name: Build the app and test APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest

      - name: Wait for the emulator
        run: |
          set -o pipefail
          scripts/ci-emulator.sh wait --cutout ${{ matrix.cutout }} | tee -a "$GITHUB_ENV"
          mkdir -p "$OUT"
          echo ui-out/ >> .git/info/exclude
          scripts/ci-emulator.sh logcat "$OUT/logcat.txt"

      - name: verify.sh ui ${{ matrix.tests }} --shard ${{ matrix.shard }}/${{ matrix.shards }}
        id: ui
        run: |
          set -o pipefail
          scripts/verify.sh ui ${{ matrix.tests }} --shard ${{ matrix.shard }}/${{ matrix.shards }} 2>&1 |
            tee "$OUT/verify.log"

      # One line per shard for the aggregate: the step's outcome, the ui-report block and Gradle's test count.
      - name: Shard summary
        if: always() && steps.ui.outcome != 'skipped'
        env:
          TESTS: ${{ matrix.tests }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
          OUTCOME: ${{ steps.ui.outcome }}
        run: |
          log="$OUT/verify.log"
          finished=$(grep -E '^Finished [0-9]+ tests' "$log" | tail -n 1)
          {
            printf '### ui %s %s (%s)\n\n' "${SHARD_ID%-*}" "$SHARD" "$TESTS"
            printf -- '- verdict: %s\n' "$OUTCOME"
            printf -- '- gradle: %s\n' "${finished:-no Finished line}"
            printf '\n```\n'
            grep -E '^ui-report:' "$log" || echo 'ui-report: no report'
            printf '```\n'
          } > "$OUT/shard.md"
          cat "$OUT/shard.md" >> "$GITHUB_STEP_SUMMARY"
          pkill -f 'adb .*logcat -v threadtime' || true

      - name: Upload the shard's reports
        if: always() && steps.ui.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per attempt: a rerun's upload is a second artifact of the same name, and the download keeps the one with
          # the highest id, which is not always the newest.
          name: ui-${{ matrix.config }}-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: |
            ui-out/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14

      - if: matrix.config == 'plain' && matrix.shard == 0
        uses: ./.github/actions/build-cache-save
        with:
          build-cache: ui

  # Every shard must have passed, uploaded its report and run at least one test.
  android-ui:
    needs: ui
    if: ${{ !cancelled() && needs.ui.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ui-*
          path: shards

      - name: Every shard passed
        env:
          UI: ${{ needs.ui.result }}
          EXPECTED: plain-0 plain-1 plain-2 plain-3 plain-4 plain-5 cutout-0 cutout-1
        run: |
          ok=0
          echo "## android-ui" >> "$GITHUB_STEP_SUMMARY"
          [ "$UI" = success ] || { echo "::error::the shard jobs ended $UI"; ok=1; }
          for id in $EXPECTED; do
            # The newest attempt's report: a shard that was not rerun keeps its earlier one.
            dir=$(ls -d "shards/ui-$id-a"* 2> /dev/null | sort -V | tail -n 1)
            md="$dir/ui-out/shard.md"
            if [ ! -f "$md" ]; then
              echo "::error::shard $id uploaded no report (missing run)"
              ok=1
              continue
            fi
            cat "$md" >> "$GITHUB_STEP_SUMMARY"
            grep -q '^- verdict: success$' "$md" || { echo "::error::shard $id did not pass"; ok=1; }
            grep -q '^ui-report: [0-9]* runs of [0-9]* tests' "$md" || { echo "::error::shard $id ran no test"; ok=1; }
            grep '^ui-report: *FAIL ' "$md" | sed "s/^/::error::$id /" || true
          done
          exit "$ok"

  # A failed nightly opens or updates an issue; the next passing one closes it.
  nightly-issue:
    needs: [android-ui]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - uses: ./.github/actions/nightly-issue
        with:
          failed: ${{ contains(needs.*.result, 'failure') }}
