# scripts/ios/test.sh --ci on a GitHub macOS runner, gated by scripts/ci-plan.sh on a Linux runner:
# - PR: when something only the iOS build reads changed (iosApp/, scripts/ios/, the iOS source sets, the build
#   files), or with the label `full-ci`. A commonMain change alone is covered by android-ci's verifyIosKlibs.
# - push to `master`: also when any shared/ module changed, so a Kotlin API change that breaks Swift shows up there.
# - manual runs: always. ios-nightly.yml runs the Kotlin/Native tests and the UI tests every night.
name: ios

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  workflow_dispatch:

# Per ref; a newer push to a PR cancels its older run, every pushed `master` SHA keeps its own result. Adding any
# label other than `full-ci` starts a run that does nothing, in a group of its own so it cancels nothing.
concurrency:
  group: >-
    ios-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci'
    && github.run_id || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # XcodeGen comes from its release, not Homebrew (which serves only the latest); the version must equal
  # ITMO_XCODEGEN_VERSION in scripts/ios/env.sh, the digest is the release asset's sha256.
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  # PR: the merge commit against its first parent (the base head). Push: the pushed range; a new branch or a lost
  # `before` builds.
  plan:
    # A fork's pushes (its sync with upstream) run nothing there; its manual runs and PRs still do.
    if: >-
      (github.event_name != 'push' || github.repository == 'alllexey-dev/ITMO.Widgets') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: scripts/ci-plan.sh
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
                git fetch --quiet --depth=1 origin "$BEFORE"; then
                base=$BEFORE
              fi
              ;;
          esac
          if [ -z "$base" ] || [ "$LABELLED" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run, full-ci label or no diff base: building."
            exit 0
          fi
          plan=$(git diff --name-only "$base" HEAD | scripts/ci-plan.sh)
          printf '%s\n' "$plan" | grep -E '^(ios|shared)='
          run=false
          printf '%s\n' "$plan" | grep -qx ios=true && run=true
          [ "$EVENT" != push ] || ! printf '%s\n' "$plan" | grep -qx shared=true || run=true
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "No iOS input changed since ${base:0:7}: nothing to build."

  ios-check:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    # The image carrying the Xcode pinned in scripts/ios/env.sh (27.0); arm64, 3 vCPU, 7 GB.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CI tests exactly the Xcode pinned in scripts/ios/env.sh: if the image drops it, the job fails until the pin
      # moves (locally env.sh only warns about another version).
      - name: Select the pinned Xcode
        run: |
          version=$(sed -n 's/^: "\${ITMO_XCODE_VERSION:=\(.*\)}"$/\1/p' scripts/ios/env.sh)
          app="/Applications/Xcode_$version.app"
          if [ -z "$version" ] || [ ! -d "$app" ]; then
            echo "::error::Xcode ${version:-?} pinned in scripts/ios/env.sh is not on this runner image; move the pin in scripts/ios/env.sh."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "ITMO_DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          pinned=$(sed -n 's/^: "\${ITMO_XCODEGEN_VERSION:=\(.*\)}"$/\1/p' scripts/ios/env.sh)
          if [ "$pinned" != "$XCODEGEN_VERSION" ]; then
            echo "::error::scripts/ios/env.sh pins XcodeGen $pinned, ios.yml installs $XCODEGEN_VERSION; update both."
            exit 1
          fi
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen"
          bin=$(dirname "$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -n 1)")
          echo "$bin" >> "$GITHUB_PATH"

      # The toolchain the job runs on, before the long steps; a pin mismatch fails here.
      - name: Toolchain pins
        run: |
          source scripts/ios/env.sh 2> "$RUNNER_TEMP/env.err"
          cat "$RUNNER_TEMP/env.err"
          if grep -q warning "$RUNNER_TEMP/env.err"; then exit 1; fi
          xcodebuild -version
          xcodegen --version
          xcrun simctl list runtimes | grep -i ios

      # The JDK gradle/gradle-daemon-jvm.properties asks for (JetBrains 21), installed up front so the daemon
      # never auto-provisions it from api.foojay.io inside xcodebuild.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jetbrains
          java-version: 21

      # Basic (MIT) cache provider; only `master` writes the cache, everything else reads it.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # Gradle uses only the JDK above: a criteria mismatch fails loudly instead of downloading a toolchain.
      - name: Gradle toolchain without auto-download
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          {
            echo "org.gradle.java.installations.auto-download=false"
            echo "org.gradle.java.installations.paths=$JAVA_HOME"
          } >> "$GRADLE_USER_HOME/gradle.properties"
          "$JAVA_HOME/bin/java" -version

      # Kotlin/Native (about 1 GB in ~/.konan) per Kotlin version and runner architecture; only `master` writes.
      - name: Kotlin/Native version
        id: kotlin-native
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Restore ~/.konan
        id: konan-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin-native.outputs.version }}

      # Resolves the wrapper distribution and the settings and build plugins (foojay-resolver-convention among
      # them) before xcodebuild, with retries: on a Gradle cache miss a plugin portal hiccup costs a retry, not
      # the job. The daemon it starts is reused by the framework build inside xcodebuild.
      - name: Resolve Gradle plugins
        run: |
          for attempt in 1 2 3; do
            ./gradlew --quiet help && exit 0
            echo "::warning::Gradle plugin resolution failed (attempt $attempt of 3)"
            sleep $((attempt * 20))
          done
          exit 1

      # The runner is below the local K/N estimate, so Gradle runs one worker (no parallel K/N) and a sampler
      # records the peak of used memory (active + wired + compressed) every 5 s. No secrets, no signing.
      - name: test.sh --ci
        env:
          CI: "true"
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/iosApp/build/snapshot-artifacts
        run: |
          echo "org.gradle.workers.max=1" >> "$GRADLE_USER_HOME/gradle.properties"
          peak="$RUNNER_TEMP/memory-peak"
          echo 0 > "$peak"
          (
            max=0
            while sleep 5; do
              used=$(vm_stat | awk '
                /page size of/ { size = $8 }
                /Pages active/ || /Pages wired down/ || /Pages occupied by compressor/ { gsub("\\.", "", $NF); pages += $NF }
                END { printf "%d", pages * size / 1048576 }')
              if [ "$used" -gt "$max" ]; then max=$used; echo "$max" > "$peak"; fi
            done
          ) &
          sampler=$!
          started=$(date +%s)
          rc=0
          scripts/ios/test.sh --ci || rc=$?
          kill "$sampler" 2> /dev/null || true
          {
            echo "## ios-check"
            echo "- test.sh --ci: $(( $(date +%s) - started )) s, exit $rc"
            echo "- peak used memory: $(cat "$peak") MB of $(( $(sysctl -n hw.memsize) / 1048576 )) MB"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Save ~/.konan
        if: >-
          github.ref == 'refs/heads/master' &&
          steps.konan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}

      - name: Upload the result bundle and snapshot diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-check-results
          path: |
            iosApp/build/test-results/
            iosApp/build/snapshot-artifacts/
          if-no-files-found: ignore
          retention-days: 14
