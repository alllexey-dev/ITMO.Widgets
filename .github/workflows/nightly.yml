# The slow suites, nightly on `master` and on demand (`gh workflow run nightly.yml --ref <branch> -f suites=<suites>`):
# - platform: the platform instrumentation list on a Gradle Managed Device
# - ui: `verify.sh ui all` in 6 shards on an emulator, `ShellSuite` in 2 shards with a tall cutout
# - ship: scripts/ship-check.sh stages 1 version, 3 release, 5 upgrade, 6 shrunk
# - ios-kn: iosSimulatorArm64Test of every shared module with an iOS target
# - advisory, never failing the run: build-health (dependency analysis) and, on Sundays, ios-ui (the XCUITest target)
# The `gate` job skips a scheduled night whose `master` head the previous scheduled run already tested. A failed
# night is reported by GitHub's own "run failed" notification; nothing opens issues.
name: nightly

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      suites:
        description: >-
          Space-separated suites: platform ui ship ios-kn build-health ios-ui, or `all` (every suite,
          ios-ui included)
        required: false
        default: all

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"

jobs:
  gate:
    # Scheduled runs only upstream: a fork that enables its schedules builds nothing.
    if: github.event_name != 'schedule' || github.repository == 'alllexey-dev/ITMO.Widgets'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the previous scheduled run
    outputs:
      suites: ${{ steps.gate.outputs.suites }}
    steps:
      - name: Suites to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.suites }}
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: platform ui ship ios-kn build-health
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            suites=$INPUT
            [ "$suites" != all ] || suites="$NIGHTLY ios-ui"
          else
            # The scheduled run before this one; a re-run of this night, or an unreadable list, runs everything.
            last=""
            if [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
              last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --event schedule \
                --status completed --limit 5 --json databaseId,headSha \
                --jq "map(select(.databaseId < $GITHUB_RUN_ID))[0].headSha // empty") ||
                { echo "::warning::could not read the previous scheduled run: running every suite"; last=""; }
            fi
            if [ "$last" = "$GITHUB_SHA" ]; then
              suites=""
              echo "The previous scheduled run already tested ${GITHUB_SHA:0:7}."
            else
              suites=$NIGHTLY
            fi
            # The flaky XCUITests once a week, on the head of that day whether or not it changed; the day the run
            # was created, so a re-run keeps it.
            created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at) ||
              created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            [ "$(date -u -d "$created" +%u)" != 7 ] || suites="$suites ios-ui"
          fi
          echo "suites: ${suites:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "suites= $suites " >> "$GITHUB_OUTPUT"

  # The platform instrumentation list under Android Test Orchestrator on a Gradle Managed Device
  # (ciDevice, AOSP API 36; ATD has no quick settings tiles), which only CI creates. One retry: the managed device
  # sometimes fails to boot.
  platform:
    needs: gate
    if: contains(needs.gate.outputs.suites, ' platform ')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ./.github/actions/android-setup
        with:
          tasks: ":app:assembleGithubDebug :app:assembleGithubDebugAndroidTest"

      - name: verify.sh ui @platform --managed-device
        run: |
          scripts/verify.sh ui @platform --managed-device && exit 0
          echo "::warning::platform tests failed, retrying once"
          scripts/verify.sh ui @platform --managed-device

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-tests-reports
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: ignore
          retention-days: 14

  # The instrumented tests on emulators: `verify.sh ui all` in 6 shards on a Pixel-geometry emulator without a cutout,
  # and `verify.sh ui ShellSuite` (the shell, its insets and Back) in 2 shards on the same emulator with the tall
  # cutout overlay. `ui-report` is the aggregate: it fails when a shard failed, is missing or ran no test, and
  # scripts/ui-report.py fails a shard on any failed run of any test, not only on the last run Gradle keeps.
  ui:
    needs: gate
    if: contains(needs.gate.outputs.suites, ' ui ')
    name: ui ${{ matrix.config }} ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { config: plain, cutout: none, tests: all, shards: 6, shard: 0 }
          - { config: plain, cutout: none, tests: all, shards: 6, shard: 1 }
          - { config: plain, cutout: none, tests: all, shards: 6, shard: 2 }
          - { config: plain, cutout: none, tests: all, shards: 6, shard: 3 }
          - { config: plain, cutout: none, tests: all, shards: 6, shard: 4 }
          - { config: plain, cutout: none, tests: all, shards: 6, shard: 5 }
          - { config: cutout, cutout: tall, tests: ShellSuite, shards: 2, shard: 0 }
          - { config: cutout, cutout: tall, tests: ShellSuite, shards: 2, shard: 1 }
    env:
      SHARD_ID: ${{ matrix.config }}-${{ matrix.shard }}
      OUT: ${{ github.workspace }}/ui-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Boots in the background while Gradle builds both APKs.
      - name: Start the emulator
        run: |
          df -h / | tail -n 1
          scripts/ci-emulator.sh start

      # Every shard builds the same APKs; one line of build cache serves them all, saved by plain shard 0.
      - uses: ./.github/actions/android-setup
        with:
          build-cache: ui
          tasks: ":app:assembleGithubDebug :app:assembleGithubDebugAndroidTest"

      - name: Build the app and test APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest

      - name: Wait for the emulator
        run: |
          set -o pipefail
          scripts/ci-emulator.sh wait --cutout ${{ matrix.cutout }} | tee -a "$GITHUB_ENV"
          mkdir -p "$OUT"
          echo ui-out/ >> .git/info/exclude
          scripts/ci-emulator.sh logcat "$OUT/logcat.txt"

      - name: verify.sh ui ${{ matrix.tests }} --shard ${{ matrix.shard }}/${{ matrix.shards }}
        id: ui
        run: |
          set -o pipefail
          scripts/verify.sh ui ${{ matrix.tests }} --shard ${{ matrix.shard }}/${{ matrix.shards }} 2>&1 |
            tee "$OUT/verify.log"

      # One line per shard for the aggregate: the step's outcome, the ui-report block and Gradle's test count.
      - name: Shard summary
        if: always() && steps.ui.outcome != 'skipped'
        env:
          TESTS: ${{ matrix.tests }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
          OUTCOME: ${{ steps.ui.outcome }}
        run: |
          log="$OUT/verify.log"
          finished=$(grep -E '^Finished [0-9]+ tests' "$log" | tail -n 1)
          {
            printf '### ui %s %s (%s)\n\n' "${SHARD_ID%-*}" "$SHARD" "$TESTS"
            printf -- '- verdict: %s\n' "$OUTCOME"
            printf -- '- gradle: %s\n' "${finished:-no Finished line}"
            printf '\n```\n'
            grep -E '^ui-report:' "$log" || echo 'ui-report: no report'
            printf '```\n'
          } > "$OUT/shard.md"
          cat "$OUT/shard.md" >> "$GITHUB_STEP_SUMMARY"
          pkill -f 'adb .*logcat -v threadtime' || true

      - name: Upload the shard's reports
        if: always() && steps.ui.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Per attempt: a rerun's upload is a second artifact of the same name, and the download keeps the one with
          # the highest id, which is not always the newest.
          name: ui-${{ matrix.config }}-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: |
            ui-out/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14

      - if: matrix.config == 'plain' && matrix.shard == 0
        uses: ./.github/actions/build-cache-save
        with:
          build-cache: ui

  # Every shard must have passed, uploaded its report and run at least one test.
  ui-report:
    needs: ui
    if: ${{ !cancelled() && needs.ui.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ui-*
          path: shards

      - name: Every shard passed
        env:
          UI: ${{ needs.ui.result }}
          EXPECTED: plain-0 plain-1 plain-2 plain-3 plain-4 plain-5 cutout-0 cutout-1
        run: |
          ok=0
          echo "## ui" >> "$GITHUB_STEP_SUMMARY"
          [ "$UI" = success ] || { echo "::error::the shard jobs ended $UI"; ok=1; }
          for id in $EXPECTED; do
            # The newest attempt's report: a shard that was not rerun keeps its earlier one.
            dir=$(ls -d "shards/ui-$id-a"* 2> /dev/null | sort -V | tail -n 1)
            md="$dir/ui-out/shard.md"
            if [ ! -f "$md" ]; then
              echo "::error::shard $id uploaded no report (missing run)"
              ok=1
              continue
            fi
            cat "$md" >> "$GITHUB_STEP_SUMMARY"
            grep -q '^- verdict: success$' "$md" || { echo "::error::shard $id did not pass"; ok=1; }
            grep -q '^ui-report: [0-9]* runs of [0-9]* tests' "$md" || { echo "::error::shard $id ran no test"; ok=1; }
            grep '^ui-report: *FAIL ' "$md" | sed "s/^/::error::$id /" || true
          done
          exit "$ok"

  # The release checks that need no release key: scripts/ship-check.sh stages 1 version and 3 release (unsigned
  # release builds, check-play-policy.sh), 5 upgrade (v2.2 githubDebug, the 2.2 data, `adb install -r` of the head)
  # and 6 shrunk (both minifiedSmoke builds started on the device), each group on a runner of its own; the device
  # stages run on that job's emulator. Stage 2 is ci.yml, stage 4 the ui suite. `ship-report` merges the parts into
  # one summary.md and uploads it as the artifact `ship-<sha7>`.
  ship:
    needs: gate
    if: contains(needs.gate.outputs.suites, ' ship ')
    name: ship ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: version-release
            only: "1,3"
            device: false
            prebuild: ""
            tasks: ":app:assembleGithubRelease :app:bundlePlayRelease"
          - name: upgrade
            only: "5"
            device: true
            prebuild: ":app:assembleGithubDebug"
            tasks: ":app:assembleGithubDebug"
          - name: shrunk
            only: "6"
            device: true
            prebuild: ":app:assembleGithubMinifiedSmoke :app:assemblePlayMinifiedSmoke"
            tasks: ":app:assembleGithubMinifiedSmoke :app:assemblePlayMinifiedSmoke"
    steps:
      # ship-check.sh keeps its summary, logs, the v2.2 worktree and the cached v2.2 APK under $SHIP_DIR.
      - name: Ship check directory
        run: |
          echo "SHIP_DIR=$RUNNER_TEMP/ship" >> "$GITHUB_ENV"
          echo "DEBUG_KEY_DIRS=$HOME/.config/.android $HOME/.android" >> "$GITHUB_ENV"

      # Full history: stage 1 reads the beta tags and origin/release/2.2, stage 5 builds the v2.2 tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Start the emulator
        if: matrix.device
        run: scripts/ci-emulator.sh start

      - uses: ./.github/actions/android-setup
        with:
          build-cache: ship-${{ matrix.name }}
          tasks: ${{ matrix.tasks }}

      # The v2.2 APK and the debug key that signed it, cached together under a key that ends in the key's certificate
      # digest. The key goes where AGP reads it before the head is built, so the head carries it and stage 5 finds the
      # APK named by that certificate. Without an entry, or if the head ends up with another key, stage 5 builds v2.2
      # in this job with the head's key: the cache only saves that build, the check never depends on it.
      - name: v2.2 commit
        id: v22
        if: matrix.name == 'upgrade'
        run: echo "sha=$(git rev-parse 'v2.2^{commit}')" >> "$GITHUB_OUTPUT"

      - name: Restore the v2.2 APK
        id: v22-cache
        if: matrix.name == 'upgrade'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SHIP_DIR }}/apk
          key: ship-v22-apk-v2-${{ steps.v22.outputs.sha }}
          restore-keys: ship-v22-apk-v2-${{ steps.v22.outputs.sha }}-

      - name: Debug key of the v2.2 APK
        if: matrix.name == 'upgrade'
        run: |
          key="$SHIP_DIR/apk/debug.keystore"
          if [ -f "$key" ]; then
            # AGP 8 and 9 keep the debug key in ~/.config/.android on these runners (~/.android on macOS).
            for dir in $DEBUG_KEY_DIRS; do
              mkdir -p "$dir"
              cp "$key" "$dir/debug.keystore"
            done
            echo "debug key from the cache, certificate SHA-256:"
            keytool -list -v -keystore "$key" -storepass android | grep 'SHA256:'
          else
            echo "no cached debug key: the head build creates one and stage 5 builds v2.2 with it"
          fi

      # Builds what the stage installs while the emulator boots; the stage's own build is then up to date.
      - name: Build ahead of the device
        if: matrix.prebuild != ''
        run: ./gradlew ${{ matrix.prebuild }}

      - name: Wait for the emulator
        if: matrix.device
        run: |
          set -o pipefail
          scripts/ci-emulator.sh wait --cutout none | tee -a "$GITHUB_ENV"

      - name: ship-check.sh --only ${{ matrix.only }}
        run: |
          flags="--keep-going --only ${{ matrix.only }}"
          [ "${{ matrix.device }}" = true ] || flags="--no-device $flags"
          scripts/ship-check.sh $flags

      # Saves the v2.2 APK signed with this runner's debug key, with that key, unless the restored entry was exactly it.
      - name: v2.2 APK cache key
        id: v22-key
        if: matrix.name == 'upgrade' && github.ref == 'refs/heads/master'
        env:
          V22_SHA: ${{ steps.v22.outputs.sha }}
        run: |
          apk=""
          for dir in $DEBUG_KEY_DIRS; do
            key="$dir/debug.keystore"
            cert=$(keytool -list -v -keystore "$key" -storepass android 2> /dev/null |
              sed -n 's/^.*SHA256: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
            [ -n "$cert" ] || continue
            apk=$(find "$SHIP_DIR/apk" -name "v2.2-*-githubDebug-${cert:0:16}.apk" | head -n 1)
            [ -z "$apk" ] || break
          done
          if [ -z "$apk" ]; then
            echo "::warning::no v2.2 APK signed with a debug key in $DEBUG_KEY_DIRS: nothing to cache"
            exit 0
          fi
          find "$SHIP_DIR/apk" -type f ! -path "$apk" -delete
          cp "$key" "$SHIP_DIR/apk/debug.keystore"
          echo "key=ship-v22-apk-v2-$V22_SHA-${cert:0:16}" >> "$GITHUB_OUTPUT"

      - name: Save the v2.2 APK
        if: >-
          steps.v22-key.outputs.key != '' &&
          steps.v22-key.outputs.key != steps.v22-cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SHIP_DIR }}/apk
          key: ${{ steps.v22-key.outputs.key }}

      - uses: ./.github/actions/build-cache-save
        with:
          build-cache: ship-${{ matrix.name }}

      - name: Upload the stage summary and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Per attempt, as the ui shards: the download keeps the highest artifact id, not the newest rerun.
          name: ship-part-${{ matrix.name }}-a${{ github.run_attempt }}
          path: ${{ env.SHIP_DIR }}/summary/
          if-no-files-found: warn
          retention-days: 14

  # One summary.md in ship-check.sh's format for the head: the rows of every part, sorted by stage; any FAIL, a
  # missing part or a failed part job fails the check. Uploaded as `ship-<sha7>` with every stage log.
  ship-report:
    needs: ship
    if: ${{ !cancelled() && needs.ship.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ship-part-*
          path: parts

      - name: Merge the summaries
        id: merge
        env:
          STAGES: ${{ needs.ship.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXPECTED: version-release upgrade shrunk
        run: |
          ok=0
          shas=$(find parts -mindepth 2 -maxdepth 2 -type d -printf '%f\n' | sort -u)
          if [ "$(printf '%s\n' "$shas" | grep -c .)" -ne 1 ]; then
            echo "::error::the parts name $(printf '%s ' $shas)instead of one head"
            ok=1
          fi
          sha=$(printf '%s\n' "$shas" | head -n 1)
          out="ship-$sha"
          mkdir -p "$out"
          rows=""
          for part in $EXPECTED; do
            dir="$(ls -d "parts/ship-part-$part-a"* 2> /dev/null | sort -V | tail -n 1)/$sha"
            if [ ! -f "$dir/summary.md" ]; then
              echo "::error::part $part left no summary (missing run)"
              rows="$rows| $part | MISSING | - | - |"$'\n'
              ok=1
              continue
            fi
            cp "$dir"/*.log "$out/" 2> /dev/null || true
            rows="$rows$(grep -E '^\| [0-9] ' "$dir/summary.md")"$'\n'
            head=$(sed -n 's/^- Head: `\(.*\)`$/\1/p' "$dir/summary.md")
            # The earliest part's start (the format sorts as text).
            part_started=$(sed -n 's/^- Started: //p' "$dir/summary.md")
            if [ -z "${started:-}" ] || [[ $part_started < $started ]]; then started=$part_started; fi
          done
          {
            printf '# Ship check %s\n\n' "$sha"
            printf -- '- Head: `%s`\n' "${head:-unknown}"
            printf -- '- Run: %s\n' "$RUN_URL"
            printf -- '- Stages 1, 3, 5, 6 ran here; stage 2 is ci.yml, 4 the ui suite\n'
            printf -- '- Started: %s\n\n' "${started:-unknown}"
            printf '| Stage | Result | Time | Log |\n|---|---|---|---|\n'
            printf '%s' "$rows" | grep . | sort
          } > "$out/summary.md"
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^\| [0-9a-z -]+ \| (FAIL|NOT RUN|MISSING) ' "$out/summary.md" && ok=1
          [ "$STAGES" = success ] || { echo "::error::the stage jobs ended $STAGES"; ok=1; }
          echo "dir=$out" >> "$GITHUB_OUTPUT"
          exit "$ok"

      - name: Upload ship-<sha7>
        if: always() && steps.merge.outputs.dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.merge.outputs.dir }}
          path: ${{ steps.merge.outputs.dir }}/
          retention-days: 30

  # iosSimulatorArm64Test of every module with an iOS target (the umbrella `ios` included).
  ios-kn:
    needs: gate
    if: contains(needs.gate.outputs.suites, ' ios-kn ')
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/ios-setup

      - name: test.sh --ci kn
        run: scripts/ios/test.sh --ci kn

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-kn-reports
          path: |
            shared/*/build/reports/
            shared/*/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Advisory: the dependency-analysis report of every module. The plugin loads only with -Pitmo.buildHealth=true, so
  # a failure here never reaches ci.yml.
  build-health:
    needs: gate
    if: contains(needs.gate.outputs.suites, ' build-health ')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/android-setup
        with:
          tasks: "-Pitmo.buildHealth=true buildHealth"

      - name: buildHealth
        run: ./gradlew -Pitmo.buildHealth=true buildHealth

      - name: Report summary
        if: always()
        run: |
          report=build/reports/dependency-analysis/build-health-report.txt
          [ -f "$report" ] || exit 0
          {
            echo '## buildHealth'
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-health-report
          path: build/reports/dependency-analysis/
          if-no-files-found: ignore
          retention-days: 14

  # Advisory, Sundays and on demand: the XCUITest target, flaky on shared runners.
  ios-ui:
    needs: gate
    if: contains(needs.gate.outputs.suites, ' ios-ui ')
    continue-on-error: true
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/ios-setup

      - name: test.sh --ci ui
        env:
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/iosApp/build/snapshot-artifacts
        run: scripts/ios/test.sh --ci ui

      # The result bundle only: the full set of a UI run is about 190 MB.
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-results
          path: iosApp/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
