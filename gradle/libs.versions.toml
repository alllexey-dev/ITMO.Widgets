[versions]
maplibre-android = "13.7.1"
# Toolchain (ADR 0018). AGP, Kotlin, CMP, google-services and Roborazzi reach the build classpath
# only through build-logic's dependencies below; modules apply them by plugin id without a version.
agp = "9.3.3"
kotlin = "2.4.20"
googleGmsGoogleServices = "4.4.4"
# androidx.compose 1.12.1 (CMP 1.12.1) AAR metadata requires compileSdk >= 37; targetSdk stays 36.
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "36"

# Compose Multiplatform 1.12.1 and the JetBrains libraries its release notes pair with it.
composeMultiplatform = "1.12.1"
# JetBrains material3 1.12.0-alpha03 requires Jetpack material3 1.5.0-alpha22 (ADR 0021).
material3 = "1.12.0-alpha03"
material3Jetpack = "1.5.0-alpha22"
jetbrainsLifecycle = "2.11.0"
# Jetpack Compose that CMP 1.12.1 maps to on Android (test rules, manifest).
androidxCompose = "1.12.1"
navigation3 = "1.2.0"

# Multiplatform libraries (master §3.1, ADRs 0019, 0025, 0026).
koin = "4.2.2"
ktor = "3.6.0"
kotlinxSerialization = "1.11.0"
atomicfu = "0.33.0"
kotlinxDatetime = "0.8.0"
okio = "3.18.2"
coil = "3.6.3"
ksoup = "0.2.6"
materialKolor = "5.0.1"
skie = "0.10.15"
myItmoApiKmp = "2.3.1"
androidxWebkit = "1.14.0"

# Tests and screenshots (ADR 0022).
robolectric = "4.17"
roborazzi = "1.76.0"
composablePreviewScanner = "0.9.3"
turbine = "1.2.1"
# Advisory buildHealth in android-nightly.yml only.
dependencyAnalysis = "3.19.2"

androidImageCropper = "4.7.0"
gson = "2.11.0"
datastorePreferences = "1.2.1"
coreKtx = "1.19.1"
coreRemoteviews = "1.1.0"
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestCore = "1.7.0"
androidxTestMonitor = "1.8.0"
androidxTestRunner = "1.7.0"
androidxTestOrchestrator = "1.6.1"
espressoCore = "3.7.0"
# Baseline and startup profiles, the :baselineprofile generator and its nightly macrobenchmarks.
benchmark = "1.5.0"
uiautomator = "2.4.0"
profileinstaller = "1.4.1"
appcompat = "1.8.0"
material = "1.13.0"
workRuntimeKtx = "2.12.0"
activity = "1.13.0"
constraintlayout = "2.2.2"
swiperefreshlayout = "1.2.0"
firebaseMessaging = "26.0.1"
konsist = "0.17.3"
konsistKotlinCompiler = "2.4.10"
coroutines = "1.11.0"
codeScanner = "16.1.0"
playAppUpdate = "2.1.0"
okhttp = "5.5.0"
mockwebserver = "5.5.0"
lifecycle = "2.11.0"
# Device pairing: HPKE sender (Android) and the screen-lock check before an ITMO session leaves the phone.
tink = "1.23.0"
biometric = "1.1.0"

[libraries]
maplibre-android = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre-android" }
# Gradle plugins on build-logic's classpath (the only place they are versioned).
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-composeCompiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
google-services-gradlePlugin = { module = "com.google.gms:google-services", version.ref = "googleGmsGoogleServices" }
baselineprofile-gradlePlugin = { module = "androidx.benchmark:benchmark-baseline-profile-gradle-plugin", version.ref = "benchmark" }
roborazzi-gradlePlugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }

# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
# Never a plain dependency: only as strictly("1.5.0-alpha22") beside compose-material3 (ADR 0021).
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3Jetpack" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidxCompose" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidxCompose" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-viewmodel-savedstate = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "jetbrainsLifecycle" }
# Navigation 3 (ADR 0020): Android only, in :app; the shared keys (AppRoute) do not depend on it (ADR 0035).
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-core-remoteviews = { module = "androidx.core:core-remoteviews", version.ref = "coreRemoteviews" }
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }
# The color science under material-kolor without Compose: the widget palettes of :shared:core.
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "materialKolor" }

# Koin (ADR 0019)
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# Ktor (ADRs 0025, 0026)
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# kotlinx and multiplatform utilities
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# Library only, for kotlinx.atomicfu.locks.SynchronizedObject; no atomicfu plugin, atomics use
# kotlin.concurrent.atomics.
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastorePreferences" }
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-test = { module = "io.coil-kt.coil3:coil-test", version.ref = "coil" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
# MyItmoApi 2.x KMP from Maven Central; MYITMOAPI_DIR swaps in a local checkout (settings.gradle.kts).
my-itmo-api-kmp = { module = "dev.alllexey:my-itmo-api-kmp", version.ref = "myItmoApiKmp" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }

# Tests and screenshots
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# Robolectric 4.17 runtime for @Config(sdk = [35]); resolved by Gradle so Robolectric never writes ~/.m2.
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version = "15-robolectric-13954326-i7" }
# Robolectric 4.17 runtime for @Config(sdk = [29]), opted in by :app through itmoTesting.extraRobolectricSdks.
robolectric-android-all-sdk29 = { module = "org.robolectric:android-all-instrumented", version = "10-robolectric-5803371-i7" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-compose-preview-scanner-support = { module = "io.github.takahirom.roborazzi:roborazzi-compose-preview-scanner-support", version.ref = "roborazzi" }
# ATF 4.1.1 through Roborazzi: accessibility checks of preview captures under Robolectric.
roborazzi-accessibility-check = { module = "io.github.takahirom.roborazzi:roborazzi-accessibility-check", version.ref = "roborazzi" }
# The android scanner finds commonMain @Preview functions; the deprecated common scanner finds none.
composable-preview-scanner-android = { module = "io.github.sergio-sastre.ComposablePreviewScanner:android", version.ref = "composablePreviewScanner" }

android-image-cropper = { module = "com.vanniktech:android-image-cropper", version.ref = "androidImageCropper" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-monitor = { module = "androidx.test:monitor", version.ref = "androidxTestMonitor" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "androidxTestOrchestrator" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workRuntimeKtx" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
konsist-kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "konsistKotlinCompiler" }
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "codeScanner" }
play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "playAppUpdate" }
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

[plugins]
# Only plugins that are not on build-logic's classpath carry a version here. AGP, Kotlin (multiplatform,
# compose, serialization), CMP, google-services, Roborazzi and androidx.baselineprofile come from build-logic: apply them by
# id without a version, or Gradle fails with "already on the classpath with an unknown version".
skie = { id = "co.touchlab.skie", version.ref = "skie" }
# Not in any plugins {} block: the root build.gradle.kts loads it only with -Pitmo.buildHealth=true.
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
