[versions]
# Toolchain (ADR 0018). AGP, Kotlin, CMP, KSP, Hilt, google-services and Roborazzi reach the build classpath
# only through build-logic's dependencies below; modules apply them by plugin id without a version.
agp = "9.3.3"
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"
googleGmsGoogleServices = "4.4.4"
# androidx.compose 1.12.1 (CMP 1.12.1) AAR metadata requires compileSdk >= 37 (SP-13a); targetSdk stays 36.
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "36"

# Compose Multiplatform 1.12.1 and the JetBrains libraries its release notes pair with it.
composeMultiplatform = "1.12.1"
# JetBrains material3 1.12.0-alpha03 requires Jetpack material3 1.5.0-alpha22 (SP-04, ADR 0021).
material3 = "1.12.0-alpha03"
material3Jetpack = "1.5.0-alpha22"
material3Adaptive = "1.3.0-rc01"
jetbrainsLifecycle = "2.11.0"
jetbrainsSavedstate = "1.4.0"
# Jetpack Compose that CMP 1.12.1 maps to on Android (test rules, manifest).
androidxCompose = "1.12.1"
navigation3 = "1.2.0"

# Multiplatform libraries (master §3.1, ADRs 0019, 0025, 0026).
koin = "4.2.2"
koinCompiler = "1.2.1"
ktor = "3.6.0"
kotlinxSerialization = "1.11.0"
atomicfu = "0.33.0"
kotlinxDatetime = "0.8.0"
kotlinxCollectionsImmutable = "0.5.2"
okio = "3.18.2"
coil = "3.6.3"
qrose = "1.3.0"
ksoup = "0.2.6"
materialKolor = "5.0.1"
skie = "0.10.15"
myItmoApiKmp = "2.0.0"

# Tests and screenshots (ADR 0022).
robolectric = "4.17"
roborazzi = "1.76.0"
composablePreviewScanner = "0.9.3"
turbine = "1.2.1"
# Advisory buildHealth in android-nightly.yml only (TC-08).
dependencyAnalysis = "3.19.2"

itmoWidgetsCore = "1.7.0"
myItmoApi = "1.8.2"
androidImageCropper = "4.7.0"
datastorePreferences = "1.2.1"
coreKtx = "1.19.1"
coreRemoteviews = "1.1.0"
junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestCore = "1.7.0"
androidxTestMonitor = "1.8.0"
androidxTestRunner = "1.7.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.13.0"
workRuntimeKtx = "2.12.0"
activity = "1.13.0"
constraintlayout = "2.2.2"
swiperefreshlayout = "1.2.0"
firebaseMessaging = "25.1.3"
navigation = "2.10.2"
konsist = "0.17.3"
konsistKotlinCompiler = "2.4.10"
coroutines = "1.11.0"
codeScanner = "16.1.0"
playAppUpdate = "2.1.0"
okhttp = "5.5.0"
mockwebserver = "5.5.0"
lifecycle = "2.11.0"
fragment = "1.6.2"
fragmentCompose = "1.8.9"
recyclerview = "1.2.1"
viewpager2 = "1.0.0"

[libraries]
# Gradle plugins on build-logic's classpath (the only place they are versioned).
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-composeCompiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
google-services-gradlePlugin = { module = "com.google.gms:google-services", version.ref = "googleGmsGoogleServices" }
roborazzi-gradlePlugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }

# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "material3Adaptive" }
# Never a plain dependency: only as strictly("1.5.0-alpha22") beside compose-material3 (SP-04, ADR 0021, L08 DS-01a).
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3Jetpack" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidxCompose" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidxCompose" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-viewmodel-savedstate = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "jetbrainsLifecycle" }
jetbrains-savedstate = { module = "org.jetbrains.androidx.savedstate:savedstate", version.ref = "jetbrainsSavedstate" }
jetbrains-savedstate-compose = { module = "org.jetbrains.androidx.savedstate:savedstate-compose", version.ref = "jetbrainsSavedstate" }
# Navigation 3 (SP-14, ADR 0020): only the runtime has iOS klibs; navigation3-ui and the ViewModel decorator stay
# in Android source sets.
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-fragment-compose = { module = "androidx.fragment:fragment-compose", version.ref = "fragmentCompose" }
androidx-core-remoteviews = { module = "androidx.core:core-remoteviews", version.ref = "coreRemoteviews" }
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

# Koin (ADR 0019)
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-androidx-workmanager = { module = "io.insert-koin:koin-androidx-workmanager", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-test-junit4 = { module = "io.insert-koin:koin-test-junit4", version.ref = "koin" }

# Ktor (ADRs 0025, 0026)
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# kotlinx and multiplatform utilities
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# Library only, for kotlinx.atomicfu.locks.SynchronizedObject (L07 KM-04); no atomicfu plugin, atomics use
# kotlin.concurrent.atomics.
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastorePreferences" }
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
coil-test = { module = "io.coil-kt.coil3:coil-test", version.ref = "coil" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
# MyItmoApi 2.x KMP: served by the pinned composite (TC-05) until M2 publishes it on Central.
my-itmo-api-kmp = { module = "dev.alllexey:my-itmo-api-kmp", version.ref = "myItmoApiKmp" }

# Tests and screenshots
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# Robolectric 4.17 runtime for @Config(sdk = [35]); resolved by Gradle so Robolectric never writes ~/.m2 (SP-13a).
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version = "15-robolectric-13954326-i7" }
# Robolectric 4.17 runtime for @Config(sdk = [29]), opted in by :app through itmoTesting.extraRobolectricSdks (KM-04).
robolectric-android-all-sdk29 = { module = "org.robolectric:android-all-instrumented", version = "10-robolectric-5803371-i7" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
roborazzi-compose-preview-scanner-support = { module = "io.github.takahirom.roborazzi:roborazzi-compose-preview-scanner-support", version.ref = "roborazzi" }
# ATF 4.1.1 through Roborazzi: accessibility checks of preview captures under Robolectric (SP-06).
roborazzi-accessibility-check = { module = "io.github.takahirom.roborazzi:roborazzi-accessibility-check", version.ref = "roborazzi" }
# The android scanner finds commonMain @Preview functions; the deprecated common scanner finds none (SP-13b).
composable-preview-scanner-android = { module = "io.github.sergio-sastre.ComposablePreviewScanner:android", version.ref = "composablePreviewScanner" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

android-image-cropper = { module = "com.vanniktech:android-image-cropper", version.ref = "androidImageCropper" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
itmo-widgets-core = { module = "dev.alllexey:itmo-widgets-core", version.ref = "itmoWidgetsCore" }
my-itmo-api = { module = "dev.alllexey:my-itmo-api", version.ref = "myItmoApi" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-monitor = { module = "androidx.test:monitor", version.ref = "androidxTestMonitor" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
konsist-kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "konsistKotlinCompiler" }
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "codeScanner" }
play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "playAppUpdate" }
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }

[plugins]
# Only plugins that are not on build-logic's classpath carry a version here. AGP, Kotlin (multiplatform,
# compose, serialization), CMP, KSP, Hilt, google-services and Roborazzi come from build-logic: apply them by
# id without a version, or Gradle fails with "already on the classpath with an unknown version".
skie = { id = "co.touchlab.skie", version.ref = "skie" }
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koinCompiler" }
# Not in any plugins {} block: the root build.gradle.kts loads it only with -Pitmo.buildHealth=true (TC-08).
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
