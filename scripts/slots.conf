# Build-slot counts for scripts/slot.sh (master plan §7.5), calibrated by SP-19 (2 concurrent Android builds is
# the limit: the 14 cores, not memory) and TC-15 (a K/N framework link costs about one Android build).
# Format: key=value, one per line; '#' starts a comment. Later lines win.
# ~/.config/itmo-agents/slots.conf overrides these for the owner's machine posture
# (for example android=1 while IDEs are open); ITMO_SLOTS_CONF replaces both (tests only).

# Concurrent jobs per kind.
android=2
kn=1
backend=1
jvm=2
emulator=2

# Android slots while every emulator slot is held.
android.emulators_full=1

# Machine-wide budget in heavy units; each unit is 2 half-unit tokens (global.<n>.lock).
global=3

# Weight of one job of each kind, in half-unit tokens of the global budget.
weight.android=2
weight.kn=2
weight.backend=2
weight.jvm=1
weight.emulator=0
