# Build-slot counts for scripts/slot.sh (master plan §7.5; SP-19 and TC-15 recalibrate).
# Format: key=value, one per line; '#' starts a comment. Later lines win.
# ~/.config/itmo-agents/slots.conf overrides these for the owner's machine posture
# (for example android=2 while IDEs are open); ITMO_SLOTS_CONF replaces both (tests only).

# Concurrent jobs per kind.
android=3
kn=1
backend=1
jvm=2
emulator=2

# Android slots while every emulator slot is held.
android.emulators_full=2

# Machine-wide budget in heavy units; each unit is 2 half-unit tokens (global.<n>.lock).
global=4

# Weight of one job of each kind, in half-unit tokens of the global budget.
weight.android=2
weight.kn=4
weight.backend=2
weight.jvm=1
weight.emulator=0
