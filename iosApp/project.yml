# The iOS project (ADR 0023, docs/ios.md). XcodeGen generates the ignored ITMOWidgets.xcodeproj from this file;
# build and test through scripts/ios/test.sh. Identifiers and signing live in Config/*.xcconfig, never here.
name: ITMOWidgets
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: ru
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    # String catalogs (IO-20): the generated tables under Shared/Strings become `LocalizedStringResource` symbols.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

# Swift packages, each at an exact version (lane L18 Pins).
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6

settingGroups:
  # Target presets set CODE_SIGN_IDENTITY at target level, above any xcconfig (SP-23); route it back to Base.xcconfig.
  signing:
    CODE_SIGN_IDENTITY: $(ITMO_CODE_SIGN_IDENTITY)

targets:
  ITMOWidgets:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The generated string tables and AppSymbol.swift, and the custom symbol images (IO-20).
      - path: Shared
      # The sign-in page's token interceptor (IO-07a, SP-21 path (a)): Android's asset by path, never a copy.
      - path: ../app/src/main/assets/token_refresh_interceptor.js
        buildPhase: resources
      # The sign-in screen's logo (IO-07b): Android's drawable by path, never a copy.
      - path: ../app/src/main/res/drawable-nodpi/auth_logo.webp
        buildPhase: resources
      # The widget sources without their @main bundle, so the hosted tests reach the timelines and entry views
      # (recipe ios-snapshot-test); the app never registers them.
      - path: Extensions/Widgets
        excludes:
          - WidgetsBundle.swift
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      groups: [signing]
      base:
        # The URL type of `itmowidgets://route/<id>` (IO-06b): Info.plist's CFBundleURLTypes reads it. Widgets and
        # Controls hold these URLs, so the scheme is frozen (StableIdentifiersTests).
        APP_URL_SCHEME: itmowidgets
    dependencies:
      - target: ITMOWidgetsWidgets
      - target: ITMOWidgetsNotificationService
    preBuildScripts:
      # Builds the Kotlin framework `Shared` before Compile Sources (direct integration). Gradle runs in the `kn`
      # build slot with the worktree's MyItmoApi pin; inside scripts/ios/test.sh the slot is already held, so the
      # nested slot.sh runs Gradle directly.
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          source "$SRCROOT/../scripts/ios/env.sh"
          cd "$ITMO_ROOT"
          pin_args=$(itmo_ios_pin_args)
          scripts/slot.sh kn -- /bin/bash -c './gradlew ${ITMO_MAX_WORKERS:+--max-workers=$ITMO_MAX_WORKERS} "$@"' gradle \
            :shared:ios:embedAndSignAppleFrameworkForXcode $pin_args

  ITMOWidgetsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Widgets
      # The generated string tables and AppSymbol.swift, and the custom symbol images (IO-20).
      - path: Shared
    configFiles:
      Debug: Config/Widgets.xcconfig
      Release: Config/Widgets.xcconfig
    settings:
      groups: [signing]

  ITMOWidgetsNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/NotificationService
      # The generated string tables and AppSymbol.swift, and the custom symbol images (IO-20); no intents, so no
      # App Shortcut phrases either (IO-11).
      - path: Shared
        excludes:
          - "Intents/**"
          - "Strings/AppShortcuts.xcstrings"
    configFiles:
      Debug: Config/NotificationService.xcconfig
      Release: Config/NotificationService.xcconfig
    settings:
      groups: [signing]

  ITMOWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    configFiles:
      Debug: Config/UnitTests.xcconfig
      Release: Config/UnitTests.xcconfig
    settings:
      groups: [signing]
    dependencies:
      - target: ITMOWidgets

  # SwiftUI and widget entry view snapshots (swift-snapshot-testing), hosted in the app like ITMOWidgetsTests.
  # References live in __Snapshots__ beside each test file and are read from the source tree, not the bundle.
  SnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SnapshotTests
        excludes:
          - "**/__Snapshots__/**"
    configFiles:
      Debug: Config/SnapshotTests.xcconfig
      Release: Config/SnapshotTests.xcconfig
    settings:
      groups: [signing]
    dependencies:
      - target: ITMOWidgets
      - package: SnapshotTesting

  # XCUITest smoke and screenshot runs against the app (scripts/ios/test.sh ui, scripts/ios/screenshots.sh).
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    configFiles:
      Debug: Config/UITests.xcconfig
      Release: Config/UITests.xcconfig
    settings:
      groups: [signing]
    dependencies:
      - target: ITMOWidgets

schemes:
  ITMOWidgets:
    build:
      targets:
        ITMOWidgets: all
    test:
      config: Debug
      gatherCoverageData: false
      # The host app of the hosted tests runs the signed-in fixture shell, so it never opens the ITMO.ID page
      # (IO-07a); the tests build their own sessions. XCUITest launches set their own arguments.
      commandLineArguments:
        "-itmoShellSession signed-in": true
      targets:
        - name: ITMOWidgetsTests
          parallelizable: false
        - name: SnapshotTests
          parallelizable: false
        # Run by `scripts/ios/test.sh ui`; the default `test.sh` run skips it.
        - name: UITests
          parallelizable: false
