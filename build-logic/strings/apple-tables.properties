# Apple-only string tables of :app:exportAppleStrings (ADR 0028), one row each:
#   <Table>.<key>=<catalog key>
# Table is InfoPlist or AppShortcuts; <key> is the .xcstrings key (an Info.plist key or a shortcut phrase) and the
# value is the Russian text of <catalog key>. Regenerate with `scripts/verify.sh run -- :app:exportAppleStrings`.
InfoPlist.CFBundleDisplayName=app_name
# Quick actions (IO-11): Info.plist's UIApplicationShortcutItemTitle holds the catalog key, InfoPlist resolves it.
InfoPlist.shortcut_qr_long=shortcut_qr_long
InfoPlist.shortcut_today_long=shortcut_today_long
# App Shortcuts (IO-11): the ASCII phrase of ITMOWidgetsShortcuts -> its Russian text.
AppShortcuts.Open the QR pass in ${applicationName}=ios_shortcut_qr_phrase_open
AppShortcuts.Show the pass of ${applicationName}=ios_shortcut_qr_phrase_show
AppShortcuts.Today in ${applicationName}=ios_shortcut_today_phrase_schedule
AppShortcuts.Lessons today in ${applicationName}=ios_shortcut_today_phrase_lessons
